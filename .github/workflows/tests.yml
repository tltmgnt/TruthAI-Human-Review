name: Human review and ResearchOS checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python tests/check_installed.py
      - run: mkdir runs
      - run: truthai-review analyze examples/review.json --output runs/synthetic
      - run: truthai-review verify runs/synthetic
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-human-review-${{ matrix.python }}
          path: runs/synthetic
          retention-days: 7
